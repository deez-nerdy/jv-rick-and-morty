databaseChangeLog:
  - changeSet:
      id: create-characters-table
      author: kravtsov-nikita
      changes:
        - createTable:
            tableName: characters
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: external_id
                  type: bigint
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: gender
                  type: varchar(255)
                  constraints:
                    nullable: false
            indexes:
              index:
                name: idx_char_name
                columns:
                  - column:
                      name: name
